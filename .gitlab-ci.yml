# Builds release packages and attaches them to the GitLab release for the tag.
#
# Make the release in GitLab first; creating its tag runs this pipeline. The
# publish job uploads whatever was built and links it to that release, and only
# creates a release itself when the tag has none. It needs the RELEASE_TOKEN
# CI/CD variable (a project access token with the `api` scope).
#
# Android (every pipeline):
#   app-armeabi-v7a-release.apk   32-bit
#   app-arm64-v8a-release.apk     64-bit
#   app-release.apk               universal, every ABI including emulators
#
# Linux (every pipeline), written to dist/:
#   freesend-<version>-linux-x86_64.AppImage
#   freesend-<version>-linux-x86_64.deb
#   freesend-<version>-linux-x86_64.rpm
#   freesend-<version>-linux-x86_64.tar.gz    raw bundle
#
# Windows (a hosted Windows runner, when one is available):
#   freesend-<version>-windows-x64.zip        contains free_send.exe

stages:
  - build
  - release

# The versioned tags in this image stop at 3.38.x, so track `stable` (currently
# Flutter 3.44.0) — it ships the Android SDK too. The build runs on every push
# to main, so a Flutter bump that breaks the app shows up immediately.

default:
  before_script:
    - export PATH="$PATH:$HOME/.pub-cache/bin"

build:apk:
  stage: build
  image: "ghcr.io/cirruslabs/flutter:stable"
  before_script:
    # Job-level before_script replaces the default one, so both run here.
    - sh scripts/setup_signing.sh
    - export PATH="$PATH:$HOME/.pub-cache/bin"
  script:
    - flutter --version
    - flutter pub get
    - flutter analyze
    - flutter test
    # Per-ABI splits plus the universal APK, on every run.
    - flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
    - flutter build apk --release
  artifacts:
    name: "freesend-apk"
    paths:
      - build/app/outputs/flutter-apk/*.apk
    expire_in: 2 weeks
  rules:
    # Build on tags and on main so a broken pipeline is caught before release.
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

build:linux:
  stage: build
  image: "ghcr.io/cirruslabs/flutter:stable"
  before_script:
    - export PATH="$PATH:$HOME/.pub-cache/bin"
    - apt-get update
    - apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev rpm curl ca-certificates file
  script:
    - flutter --version
    - flutter pub get
    - flutter build linux --release
    - sh scripts/package_linux.sh
  artifacts:
    name: "freesend-linux"
    paths:
      - dist/*
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

# GitLab.com shared Windows runners are not on every plan. The job is allowed
# to fail so a missing runner does not block the Android and Linux release.
build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  allow_failure: true
  script:
    - flutter pub get
    - flutter build windows --release
    - powershell -File scripts/package_windows.ps1
  artifacts:
    name: "freesend-windows"
    paths:
      - dist/*
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

release:publish:
  stage: release
  image: "alpine:3.20"
  needs:
    - job: build:apk
      artifacts: true
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl git python3
  script:
    - sh scripts/publish_release.sh
