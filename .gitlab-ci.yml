# Builds the Android release and attaches it to the GitLab release for the tag.
#
# Make the release in GitLab first; creating its tag runs this pipeline. The
# job uploads the APK and links it to that release, and only creates a release
# itself when the tag has none. It needs the RELEASE_TOKEN CI/CD variable (a
# project access token with the `api` scope).

stages:
  - build
  - release

variables:
  # Keep in step with the Flutter version installed on the dev machine.
  FLUTTER_VERSION: "3.47.5"

default:
  before_script:
    - export PATH="$PATH:$HOME/.pub-cache/bin"

build:apk:
  stage: build
  image: "ghcr.io/cirruslabs/flutter:${FLUTTER_VERSION}"
  script:
    - flutter --version
    - flutter pub get
    - flutter analyze
    - flutter test
    - flutter build apk --release
  artifacts:
    name: "freesend-apk"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 2 weeks
  rules:
    # Build on tags and on main so a broken pipeline is caught before release.
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"

release:publish:
  stage: release
  image: "alpine:3.20"
  needs:
    - job: build:apk
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl git python3
  script:
    - sh scripts/publish_release.sh
