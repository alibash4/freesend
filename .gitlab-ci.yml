# Verifies every push to main, and builds release packages when a tag appears.
#
# Pushing to main runs only the `test` job: analyze plus the test suite, no
# packages and no artifacts. The build matrix is tag-only, because a full
# release build costs roughly 45 runner-minutes and the monthly compute quota
# is finite. Creating a release in GitLab also creates its tag, so the tag is
# what starts the build.
#
# Make the release in GitLab first; creating its tag runs this pipeline. The
# publish job uploads whatever was built and links it to that release, and only
# creates a release itself when the tag has none. It needs the RELEASE_TOKEN
# CI/CD variable (a project access token with the `api` scope).
#
# Test (every push to main):
#   flutter analyze --no-fatal-infos; flutter test
#
# Android (tags):
#   app-armeabi-v7a-release.apk   32-bit
#   app-arm64-v8a-release.apk     64-bit
#   app-release.apk               universal, every ABI including emulators
#
# Linux (tags), written to dist/:
#   freesend-<version>-linux-x86_64.AppImage
#   freesend-<version>-linux-x86_64.deb
#   freesend-<version>-linux-x86_64.rpm
#   freesend-<version>-linux-x86_64.tar.gz    raw bundle
# The same four for aarch64, built on a hosted Arm runner.
#
# Windows (tags, a hosted Windows runner, when one is available):
#   freesend-<version>-windows-x64.zip        contains free_send.exe

stages:
  - test
  - build
  - release

# The cirruslabs image is only a base for the Android SDK and system packages;
# its newest tag is 3.44.0. install_flutter.sh pins the SDK the project builds
# with (3.50.0) on every job, including the arm64 runner.

variables:
  FREESEND_FLUTTER_VERSION: "3.50.0"
  FREESEND_FLUTTER_ROOT: "/opt/flutter-3.50.0"

default:
  before_script:
    - sh scripts/install_flutter.sh
    - export PATH="$FREESEND_FLUTTER_ROOT/bin:$PATH"
    - export PATH="$PATH:$HOME/.pub-cache/bin"

# Cheap verification on every push. Deliberately builds nothing: packaging is
# the expensive part of a pipeline, and a broken commit is caught here before
# it can cost a release build.
test:
  stage: test
  image: "ghcr.io/cirruslabs/flutter:3.44.0"
  script:
    - flutter --version
    - flutter pub get
    # Flutter 3.50 deprecates the material.dart umbrella; the replacement
    # package is not adopted yet, so info-level deprecations must not fail CI.
    - flutter analyze --no-fatal-infos
    - flutter test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:apk:
  stage: build
  image: "ghcr.io/cirruslabs/flutter:3.44.0"
  before_script:
    # Job-level before_script replaces the default one, so both run here.
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates xz-utils unzip git
    - sh scripts/install_flutter.sh
    - export PATH="$FREESEND_FLUTTER_ROOT/bin:$PATH"
    - sh scripts/setup_signing.sh
    - export PATH="$PATH:$HOME/.pub-cache/bin"
  script:
    - flutter --version
    - flutter pub get
    # Flutter 3.50 deprecates the material.dart umbrella; the replacement
    # package is not adopted yet, so info-level deprecations must not fail CI.
    - flutter analyze --no-fatal-infos
    - flutter test
    # Per-ABI splits plus the universal APK.
    - flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
    - flutter build apk --release
  artifacts:
    name: "freesend-apk"
    paths:
      - build/app/outputs/flutter-apk/*.apk
    expire_in: 2 weeks
  rules:
    # Release builds run on tags only; pushes to main are covered by `test`.
    - if: $CI_COMMIT_TAG

# A sideloadable debug APK on every push to main, so the current dev build
# can be installed and tried without cutting a release.
build:apk:debug:
  stage: build
  image: "ghcr.io/cirruslabs/flutter:3.44.0"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates xz-utils unzip git
    - sh scripts/install_flutter.sh
    - export PATH="$FREESEND_FLUTTER_ROOT/bin:$PATH"
    - export PATH="$PATH:$HOME/.pub-cache/bin"
  script:
    - flutter --version
    - flutter pub get
    - flutter analyze --no-fatal-infos
    - flutter test
    - flutter build apk --debug
  artifacts:
    name: "freesend-apk-debug"
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:linux:
  stage: build
  image: "ghcr.io/cirruslabs/flutter:3.44.0"
  before_script:
    - export PATH="$PATH:$HOME/.pub-cache/bin"
    - apt-get update
    - apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libblkid-dev liblzma-dev rpm curl ca-certificates xz-utils unzip git file
    - sh scripts/install_flutter.sh
    - export PATH="$FREESEND_FLUTTER_ROOT/bin:$PATH"
  script:
    - flutter --version
    - flutter pub get
    - flutter build linux --release
    - sh scripts/package_linux.sh
  artifacts:
    name: "freesend-linux"
    paths:
      - dist/*
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG

# Arm64 Linux on a hosted Arm runner. The cirruslabs image provides the arm64
# system base; install_flutter.sh clones Flutter 3.50.0 for this architecture.
build:linux:arm64:
  stage: build
  tags:
    - saas-linux-small-arm64
  image: "ghcr.io/cirruslabs/flutter:3.44.0"
  before_script:
    - export PATH="$PATH:$HOME/.pub-cache/bin"
    - apt-get update
    - apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libblkid-dev liblzma-dev rpm curl ca-certificates xz-utils unzip git file
    - sh scripts/install_flutter.sh
    - export PATH="$FREESEND_FLUTTER_ROOT/bin:$PATH"
  script:
    - flutter --version
    - flutter pub get
    - flutter build linux --release
    - ARCH=aarch64 sh scripts/package_linux.sh
  artifacts:
    name: "freesend-linux-arm64"
    paths:
      - dist/*
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG

# GitLab.com shared Windows runners are not on every plan. The job is allowed
# to fail so a missing runner does not block the Android and Linux release.
build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  allow_failure: true
  before_script:
    # The hosted Windows runner has no Flutter SDK and its shell is PowerShell,
    # so the project's bash before_script does not even parse here. Fetch the
    # current stable SDK and put it on PATH for the script below.
    - |
      $ErrorActionPreference = "Stop"
      $flutterRoot = "C:\flutter"
      if (-not (Test-Path (Join-Path $flutterRoot "bin\flutter.bat"))) {
        $index = Invoke-RestMethod "https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json"
        $stable = $index.current_release.stable
        $release = $index.releases | Where-Object { $_.hash -eq $stable -and $_.channel -eq "stable" } | Select-Object -First 1
        $zip = Join-Path $env:TEMP "flutter-windows.zip"
        curl.exe --location --silent --show-error --fail --output $zip "https://storage.googleapis.com/flutter_infra_release/releases/$($release.archive)"
        Expand-Archive -LiteralPath $zip -DestinationPath "C:\" -Force
        Remove-Item -LiteralPath $zip
      }
      $env:PATH = "$flutterRoot\bin;$env:PATH"
  script:
    - flutter --version
    - flutter pub get
    - flutter build windows --release
    - powershell -File scripts/package_windows.ps1
  artifacts:
    name: "freesend-windows"
    paths:
      - dist/*
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG

release:publish:
  stage: release
  image: "alpine:3.20"
  needs:
    - job: build:apk
      artifacts: true
    - job: build:linux
      artifacts: true
    - job: build:linux:arm64
      artifacts: true
    - job: build:windows
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl git python3
  script:
    - sh scripts/publish_release.sh
