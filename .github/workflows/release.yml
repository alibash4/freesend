# Release builds for every platform on version tags. Each job builds its
# packages and attaches them to the GitLab release, which stays the release
# host because the in-app updater reads GitLab Releases.
#
# Secrets needed on the repository:
#   RELEASE_TOKEN                GitLab project access token, api scope
#   SIGNING_KEYSTORE_BASE64      Android release keystore, base64
#   SIGNING_STORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD
name: release

on:
  push:
    tags:
      - "v*"

env:
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
  GITLAB_PROJECT_ID: "88767048"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: sh scripts/setup_signing.sh
      - name: Build APKs
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          flutter build apk --release
      - name: Attach APKs to the release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK_DIR="build/app/outputs/flutter-apk"
          mkdir -p dist
          cp "$APK_DIR/app-armeabi-v7a-release.apk" "dist/freesend-${VERSION}-android-32bit.apk"
          cp "$APK_DIR/app-arm64-v8a-release.apk" "dist/freesend-${VERSION}-android-64bit.apk"
          cp "$APK_DIR/app-release.apk" "dist/freesend-${VERSION}-android-universal.apk"
          sh scripts/attach_release_asset.sh "FreeSend for Android (32-bit)" "dist/freesend-${VERSION}-android-32bit.apk"
          sh scripts/attach_release_asset.sh "FreeSend for Android (64-bit)" "dist/freesend-${VERSION}-android-64bit.apk"
          sh scripts/attach_release_asset.sh "FreeSend for Android (universal)" "dist/freesend-${VERSION}-android-universal.apk"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libblkid-dev liblzma-dev \
            rpm curl ca-certificates xz-utils unzip git file
      - name: Build Linux packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          flutter pub get
          flutter build linux --release
          sh scripts/package_linux.sh
      - name: Attach Linux packages to the release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sh scripts/attach_release_asset.sh "FreeSend for Linux x86_64 (AppImage)" "dist/freesend-${VERSION}-linux-x86_64.AppImage"
          sh scripts/attach_release_asset.sh "FreeSend for Linux x86_64 (deb)" "dist/freesend-${VERSION}-linux-x86_64.deb"
          sh scripts/attach_release_asset.sh "FreeSend for Linux x86_64 (rpm)" "dist/freesend-${VERSION}-linux-x86_64.rpm"
          sh scripts/attach_release_asset.sh "FreeSend for Linux x86_64 (bundle)" "dist/freesend-${VERSION}-linux-x86_64.tar.gz"

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libblkid-dev liblzma-dev \
            rpm curl ca-certificates xz-utils unzip git file
      - name: Build Linux arm64 packages
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: aarch64
        run: |
          flutter pub get
          flutter build linux --release
          sh scripts/package_linux.sh
      - name: Attach Linux arm64 packages to the release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sh scripts/attach_release_asset.sh "FreeSend for Linux aarch64 (AppImage)" "dist/freesend-${VERSION}-linux-aarch64.AppImage"
          sh scripts/attach_release_asset.sh "FreeSend for Linux aarch64 (deb)" "dist/freesend-${VERSION}-linux-aarch64.deb"
          sh scripts/attach_release_asset.sh "FreeSend for Linux aarch64 (rpm)" "dist/freesend-${VERSION}-linux-aarch64.rpm"
          sh scripts/attach_release_asset.sh "FreeSend for Linux aarch64 (bundle)" "dist/freesend-${VERSION}-linux-aarch64.tar.gz"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Build Windows
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          flutter pub get
          flutter build windows --release
          powershell -File scripts/package_windows.ps1
      - name: Attach the Windows package to the release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sh scripts/attach_release_asset.sh "FreeSend for Windows (exe)" "dist/freesend-${VERSION}-windows-x64.zip"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Build macOS
        run: |
          flutter pub get
          flutter build macos --release
      - name: Package the app
        run: |
          set -euo pipefail
          APP=$(find "build/macos/Build/Products/Release" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then echo "No built .app found" >&2; exit 1; fi

          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/freesend-macos.zip"

          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "FreeSend" \
            -srcfolder "$STAGE" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            -quiet \
            "dist/freesend-macos.dmg"
          rm -rf "$STAGE"
          ls -lh dist/
      - name: Attach the macOS build to the release
        run: sh scripts/attach_release_asset.sh "FreeSend for macOS (dmg)" "dist/freesend-macos.dmg"
