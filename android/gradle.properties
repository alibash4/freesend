# The Flutter template's 4G heap plus a separate Kotlin daemon does not fit a
# 15GB machine that is also running a desktop, and it OOMs 4GB CI runners.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# Built-in Kotlin is enabled: AGP 9 compiles Kotlin itself and plugins must
# not apply the Kotlin Gradle Plugin.
android.builtInKotlin=true
android.newDsl=false
# This newDsl flag was added automatically by Flutter migrator
kotlin.jvm.target.validation.mode=ignore
