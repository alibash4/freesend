plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release builds must be signed with one stable key, otherwise an update
// installed over an existing copy is rejected by Android. CI writes a
// key.properties from its variables; local builds fall back to debug signing.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def hasReleaseKey() {
    if (keystorePropertiesFile.exists()) {
        return keystoreProperties['STORE_FILE'] != null &&
               keystoreProperties['STORE_PASSWORD'] != null &&
               keystoreProperties['KEY_ALIAS'] != null &&
               keystoreProperties['KEY_PASSWORD'] != null
    }
    return false
}

android {
    namespace = "com.freesend.free_send"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.freesend.free_send"
        // LocalOnlyHotspot (hotspot hosting) requires Android 8.0.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseKey()) {
                storeFile file(keystoreProperties['STORE_FILE'])
                storePassword keystoreProperties['STORE_PASSWORD']
                keyAlias keystoreProperties['KEY_ALIAS']
                keyPassword keystoreProperties['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKey()) {
                signingConfig signingConfigs.release
            } else {
                // TODO: Replace with a real keystore for published builds.
                // Signing with the debug keys for now, so `flutter run --release` works.
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // FileProvider hands a downloaded update to the system package installer.
    implementation("androidx.core:core-ktx:1.13.1")
}
