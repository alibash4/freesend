# CircleCI builds macOS and Windows, which GitLab CI here cannot reach: macOS
# needs an Apple-silicon executor and Windows needs a Windows host.
#
# Release publishing stays in GitLab CI, which owns the tags and the release
# token. This pipeline only builds and stores artifacts.
version: 2.1

orbs:
  flutter: circleci/flutter@3.0.0

executors:
  apple-silicon:
    macos:
      xcode: 16.4.0
      resource_class: m4pro.medium
  windows:
    machine:
      image: windows-server-2022-gui:current
      resource_class: windows.medium

jobs:
  build-macos:
    executor: apple-silicon
    steps:
      - checkout
      - flutter/install_sdk_and_pub:
          channel: stable
          version: 3.50.0
      - run:
          name: Build macOS
          command: flutter build macos --release
      - run:
          name: Package the app
          command: |
            set -euo pipefail
            APP=$(find "build/macos/Build/Products/Release" -maxdepth 1 -name '*.app' -print -quit)
            if [ -z "$APP" ]; then echo "No built .app found" >&2; exit 1; fi

            mkdir -p dist
            ditto -c -k --keepParent "$APP" "dist/freesend-macos.zip"

            # A DMG is what a macOS user expects: mount it, drag the app onto
            # Applications. hdiutil ships with the OS, so there is nothing to
            # install on the executor.
            STAGE="$(mktemp -d)"
            cp -R "$APP" "$STAGE/"
            ln -s /Applications "$STAGE/Applications"
            hdiutil create \
              -volname "FreeSend" \
              -srcfolder "$STAGE" \
              -fs HFS+ \
              -format UDZO \
              -ov \
              -quiet \
              "dist/freesend-macos.dmg"
            rm -rf "$STAGE"

            ls -lh dist/
      - run:
          name: Attach the macOS build to the GitLab release
          command: |
            set -euo pipefail
            : "${RELEASE_TOKEN:?Set RELEASE_TOKEN to a GitLab project access token with the api scope.}"
            : "${CIRCLE_TAG:?This job only runs on tags.}"

            GITLAB_API="https://gitlab.com/api/v4/projects/88767048"
            ASSET_NAME="FreeSend for macOS (dmg)"
            FILE="dist/freesend-macos.dmg"

            if [ ! -f "$FILE" ]; then
              echo "$FILE was not produced" >&2
              exit 1
            fi

            # Upload to GitLab first: a release asset link points at the
            # uploaded file.
            UPLOAD_RESPONSE="$(
              curl --silent --show-error --fail \
                --request POST \
                --header "PRIVATE-TOKEN: ${RELEASE_TOKEN}" \
                --form "file=@${FILE}" \
                "${GITLAB_API}/uploads"
            )"
            UPLOAD_PATH="$(printf '%s' "$UPLOAD_RESPONSE" | sed -n 's/.*"url"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            if [ -z "$UPLOAD_PATH" ]; then
              echo "Upload failed: $UPLOAD_RESPONSE" >&2
              exit 1
            fi
            UPLOAD_URL="https://gitlab.com${UPLOAD_PATH}"
            echo "Uploaded ${FILE} to ${UPLOAD_URL}"

            # The release is expected to already exist: create it in GitLab
            # before pushing the tag, as the README describes.
            BODY="$(
              printf '{"name":"%s","url":"%s","direct_asset_url":"%s","link_type":"package"}' \
                "$ASSET_NAME" "$UPLOAD_URL" "$UPLOAD_URL"
            )"
            HTTP_CODE="$(
              curl --silent --show-error \
                --request POST \
                --header "PRIVATE-TOKEN: ${RELEASE_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "${BODY}" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "${GITLAB_API}/releases/${CIRCLE_TAG}/assets/links"
            )"
            case "$HTTP_CODE" in
              2*) echo "Attached ${ASSET_NAME} to release ${CIRCLE_TAG}." ;;
              *)
                echo "Could not attach ${ASSET_NAME} to release ${CIRCLE_TAG} (HTTP ${HTTP_CODE})." >&2
                echo "Create the release in GitLab before pushing the tag." >&2
                exit 1
                ;;
            esac
      - store_artifacts:
          path: dist

  build-windows:
    executor: windows
    steps:
      - checkout
      # The Windows image ships no Flutter SDK. Pin the same version as the
      # macOS job rather than tracking whatever stable happens to be.
      - run:
          name: Install Flutter
          command: |
            $ErrorActionPreference = "Stop"
            $flutterVersion = "3.50.0"
            $flutterRoot = "C:\flutter"
            if (-not (Test-Path (Join-Path $flutterRoot "bin\flutter.bat"))) {
              $zip = Join-Path $env:TEMP "flutter-windows.zip"
              curl.exe --location --silent --show-error --fail --output $zip "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$flutterVersion-stable.zip"
              Expand-Archive -LiteralPath $zip -DestinationPath "C:\" -Force
              Remove-Item -LiteralPath $zip
            }
            $env:PATH = "$flutterRoot\bin;$env:PATH"
            flutter --version
      - run:
          name: Build Windows
          command: |
            $env:PATH = "C:\flutter\bin;$env:PATH"
            flutter pub get
            flutter build windows --release
      - run:
          name: Package the app
          command: |
            $env:PATH = "C:\flutter\bin;$env:PATH"
            powershell -File scripts/package_windows.ps1
            Get-ChildItem dist
      - run:
          name: Attach the Windows build to the GitLab release
          command: |
            $ErrorActionPreference = "Stop"
            if (-not $env:RELEASE_TOKEN) { Write-Error "Set RELEASE_TOKEN to a GitLab project access token with the api scope."; exit 1 }
            if (-not $env:CIRCLE_TAG) { Write-Error "This job only runs on tags."; exit 1 }

            $gitlabApi = "https://gitlab.com/api/v4/projects/88767048"
            $assetName = "FreeSend for Windows (exe)"
            $file = "dist\freesend-windows-x64.zip"

            if (-not (Test-Path $file)) { Write-Error "$file was not produced"; exit 1 }

            # Upload to GitLab first: a release asset link points at the
            # uploaded file. curl.exe, not the PowerShell curl alias.
            $upload = curl.exe --silent --show-error --fail --request POST --header "PRIVATE-TOKEN: $env:RELEASE_TOKEN" --form "file=@$file" "$gitlabApi/uploads"
            if ($LASTEXITCODE -ne 0) { Write-Error "Upload failed: $upload"; exit 1 }
            $uploadUrl = "https://gitlab.com" + ($upload | ConvertFrom-Json).url
            Write-Output "Uploaded $file to $uploadUrl"

            $body = @{
              name             = $assetName
              url              = $uploadUrl
              direct_asset_url = $uploadUrl
              link_type        = "package"
            } | ConvertTo-Json -Compress

            $httpCode = curl.exe --silent --show-error --request POST --header "PRIVATE-TOKEN: $env:RELEASE_TOKEN" --header "Content-Type: application/json" --data $body --output NUL --write-out "%{http_code}" "$gitlabApi/releases/$env:CIRCLE_TAG/assets/links"
            if ($LASTEXITCODE -ne 0) { Write-Error "Attach request failed."; exit 1 }
            if ("$httpCode" -notmatch "^2") {
              Write-Error "Could not attach $assetName to release $env:CIRCLE_TAG (HTTP $httpCode). Create the release in GitLab before pushing the tag."
              exit 1
            }
            Write-Output "Attached $assetName to release $env:CIRCLE_TAG."
      - store_artifacts:
          path: dist

workflows:
  macos:
    # CircleCI skips every job for a tag unless a filter explicitly allows it,
    # so the workflow-level guard this used to have was not enough. Release
    # tags are the only thing that should build macOS.
    jobs:
      - build-macos:
          filters: pipeline.git.tag matches /^v.*/
  windows:
    jobs:
      - build-windows:
          filters: pipeline.git.tag matches /^v.*/
