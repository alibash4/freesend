name: free_send
description: "FreeSend — direct, hotspot-only file transfer. No cloud, no accounts, no limits."
publish_to: "none"
version: 1.0.0+1
license: AGPL-3.0-only

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  file_picker: ^13.3.3
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  scroll_animator: ^0.3.0
  mobile_scanner: ^7.5.0
  uicons: ^1.0.1
  uicons_brands: ^1.0.0
  http: ^1.6.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  crypto: ^3.0.8
  convert: ^3.1.2
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  cryptography: ^2.9.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/tray/
    - assets/freesend.png
    - assets/fonts/OFL-Cairo.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
