name: free_send
description: "Free Send — direct, hotspot-only file transfer. No cloud, no accounts, no limits."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  file_picker: ^8.1.6
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  scroll_animator: ^0.3.0
  mobile_scanner: ">=5.2.3 <6.0.0"
  lucide_icons_flutter: ^4.0.3
  http: ^1.6.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
